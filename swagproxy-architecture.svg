<svg width="680" height="410" viewBox="0 0 680 410" role="img" xmlns="http://www.w3.org/2000/svg">
<title>SwagProxy launcher architecture</title>
<desc>SwagProxy is a launcher jar that boots a Velocity proxy with Geyser and Floodgate plugins inside. Java players connect over TCP, Bedrock players over UDP, and Velocity routes both to the hub and main servers.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#8a8f98" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
<style>
  text { font-family: 'Segoe UI', Arial, sans-serif; }
  .th { font-size: 15px; font-weight: 600; }
  .ts { font-size: 12px; opacity: 0.75; }
</style></defs>
<rect x="0" y="0" width="680" height="410" fill="#12151c"/>
<g><rect x="30" y="90" width="130" height="56" rx="8" fill="#123c3a" stroke="#2ec4b6" stroke-width="1"/><text class="th" x="95" y="112" text-anchor="middle" dominant-baseline="central" fill="#9ef0e8">Java player</text><text class="ts" x="95" y="130" text-anchor="middle" dominant-baseline="central" fill="#9ef0e8">TCP 25565</text></g>
<g><rect x="30" y="210" width="130" height="56" rx="8" fill="#42201d" stroke="#ff6f61" stroke-width="1"/><text class="th" x="95" y="232" text-anchor="middle" dominant-baseline="central" fill="#ffc0b8">Bedrock player</text><text class="ts" x="95" y="250" text-anchor="middle" dominant-baseline="central" fill="#ffc0b8">UDP 19132</text></g>
<g><rect x="200" y="40" width="280" height="330" rx="20" fill="#1b1f28" stroke="#8a8f98" stroke-width="1"/><text class="th" x="340" y="66" text-anchor="middle" dominant-baseline="central" fill="#e6e8ec">SwagProxy.jar</text><text class="ts" x="340" y="86" text-anchor="middle" dominant-baseline="central" fill="#b7bcc5">Downloads, configs, boots</text></g>
<g><rect x="220" y="110" width="240" height="240" rx="12" fill="#241d3a" stroke="#9b7bff" stroke-width="1"/><text class="th" x="340" y="134" text-anchor="middle" dominant-baseline="central" fill="#d4c6ff">Velocity proxy</text><text class="ts" x="340" y="152" text-anchor="middle" dominant-baseline="central" fill="#d4c6ff">Routing and sessions</text></g>
<g><rect x="240" y="180" width="200" height="50" rx="8" fill="#42201d" stroke="#ff6f61" stroke-width="1"/><text class="th" x="340" y="199" text-anchor="middle" dominant-baseline="central" fill="#ffc0b8">Geyser plugin</text><text class="ts" x="340" y="217" text-anchor="middle" dominant-baseline="central" fill="#ffc0b8">Bedrock translation</text></g>
<g><rect x="240" y="245" width="200" height="50" rx="8" fill="#42201d" stroke="#ff6f61" stroke-width="1"/><text class="th" x="340" y="264" text-anchor="middle" dominant-baseline="central" fill="#ffc0b8">Floodgate</text><text class="ts" x="340" y="282" text-anchor="middle" dominant-baseline="central" fill="#ffc0b8">Xbox auth, no Java acct</text></g>
<g><rect x="520" y="120" width="120" height="50" rx="8" fill="#1b1f28" stroke="#5b616b" stroke-width="1"/><text class="th" x="580" y="145" text-anchor="middle" dominant-baseline="central" fill="#e6e8ec">Hub server</text></g>
<g><rect x="520" y="200" width="120" height="56" rx="8" fill="#1b1f28" stroke="#5b616b" stroke-width="1"/><text class="th" x="580" y="221" text-anchor="middle" dominant-baseline="central" fill="#e6e8ec">Main servers</text><text class="ts" x="580" y="240" text-anchor="middle" dominant-baseline="central" fill="#b7bcc5">via /server, portals</text></g>
<line x1="162" y1="118" x2="196" y2="118" stroke="#8a8f98" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="162" y1="238" x2="196" y2="238" stroke="#8a8f98" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="482" y1="145" x2="516" y2="145" stroke="#8a8f98" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="482" y1="228" x2="516" y2="228" stroke="#8a8f98" stroke-width="1.5" marker-end="url(#arrow)"/>
</svg>
